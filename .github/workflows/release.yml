name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild clean build \
            -project SparkleShare-Mac.xcodeproj \
            -scheme SparkleShare-Mac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          cd build/Build/Products/Release
          mkdir -p dmg-contents
          cp -R SparkleShare-Mac.app dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "SparkleShare" -srcfolder dmg-contents -ov -format UDZO SparkleShare-Mac.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/Build/Products/Release/SparkleShare-Mac.dmg
          generate_release_notes: true
